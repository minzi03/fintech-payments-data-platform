name: fintech-payments-data-platform

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-fintech-payments-airflow:3.3.0}
  build:
    context: .
    dockerfile: infrastructure/airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW_EXECUTOR:-LocalExecutor}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY must be set}
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${AIRFLOW_TIMEZONE:-UTC}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-platform-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY must be set}
    # yamllint disable-line rule:line-length
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DATABASE_USER:?AIRFLOW_DATABASE_USER must be set}:${AIRFLOW_DATABASE_PASSWORD:?AIRFLOW_DATABASE_PASSWORD must be set}@airflow-postgres:5432/${AIRFLOW_DATABASE_NAME:?AIRFLOW_DATABASE_NAME must be set}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # yamllint disable-line rule:line-length
    AIRFLOW_CONN_CONTROL_DB: postgresql://${CONTROL_DATABASE_USER:?CONTROL_DATABASE_USER must be set}:${CONTROL_DATABASE_PASSWORD:?CONTROL_DATABASE_PASSWORD must be set}@airflow-postgres:5432/${AIRFLOW_DATABASE_NAME:?AIRFLOW_DATABASE_NAME must be set}
    AIRFLOW_TIMEZONE: ${AIRFLOW_TIMEZONE:-UTC}
    AIRFLOW_SETTLEMENT_SCHEDULE: ${AIRFLOW_SETTLEMENT_SCHEDULE:-0 1 * * *}
    AIRFLOW_CDC_HEALTH_SCHEDULE: ${AIRFLOW_CDC_HEALTH_SCHEDULE:-*/5 * * * *}
    AIRFLOW_SILVER_SCHEDULE: ${AIRFLOW_SILVER_SCHEDULE:-*/15 * * * *}
    AIRFLOW_TASK_RETRIES: ${AIRFLOW_TASK_RETRIES:-2}
    AIRFLOW_RETRY_DELAY_SECONDS: ${AIRFLOW_RETRY_DELAY_SECONDS:-60}
    AIRFLOW_TASK_TIMEOUT_SECONDS: ${AIRFLOW_TASK_TIMEOUT_SECONDS:-1800}
    SETTLEMENT_REJECTION_WARN_RATE: ${SETTLEMENT_REJECTION_WARN_RATE:-0.01}
    SETTLEMENT_REJECTION_FAIL_RATE: ${SETTLEMENT_REJECTION_FAIL_RATE:-0.05}
    SILVER_REJECTION_WARN_RATE: ${SILVER_REJECTION_WARN_RATE:-0.01}
    SILVER_REJECTION_FAIL_RATE: ${SILVER_REJECTION_FAIL_RATE:-0.05}
    CDC_LAG_WARN_THRESHOLD: ${CDC_LAG_WARN_THRESHOLD:-1000}
    CDC_LAG_FAIL_THRESHOLD: ${CDC_LAG_FAIL_THRESHOLD:-10000}
    CDC_FRESHNESS_WARN_SECONDS: ${CDC_FRESHNESS_WARN_SECONDS:-120}
    CDC_FRESHNESS_FAIL_SECONDS: ${CDC_FRESHNESS_FAIL_SECONDS:-600}
    # yamllint disable-line rule:line-length
    DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_CONNECT_URL: http://kafka-connect:8083
    DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:-payments-postgres-cdc}
    CDC_CONSUMER_GROUP_ID: ${CDC_CONSUMER_GROUP_ID:-fintech-cdc-bronze-v1}
    CDC_CONSUMER_TOPICS: ${CDC_CONSUMER_TOPICS:?CDC_CONSUMER_TOPICS must be set}
    CDC_CONSUMER_MANIFEST_DB: /opt/airflow/project/data/cdc-consumer/cdc_consumer_manifest.sqlite3
    STORAGE_BACKEND: minio
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    MINIO_SECURE: ${MINIO_SECURE:-false}
    MINIO_REGION: ${MINIO_REGION:-us-east-1}
    MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-fintech-bronze}
    MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-fintech-quarantine}
    MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-fintech-silver}
    MINIO_CONNECT_TIMEOUT_SECONDS: ${MINIO_CONNECT_TIMEOUT_SECONDS:-5}
    MINIO_READ_TIMEOUT_SECONDS: ${MINIO_READ_TIMEOUT_SECONDS:-30}
    MINIO_MAX_RETRIES: ${MINIO_MAX_RETRIES:-3}
    SETTLEMENT_INBOUND_DIR: /opt/airflow/project/data/inbound/settlements
    SETTLEMENT_PARTNER_ID: ${SETTLEMENT_PARTNER_ID:-VCB}
    SETTLEMENT_MANIFEST_DB: /opt/airflow/project/data/control/settlement_manifest.sqlite3
    SILVER_LOCAL_ROOT: /opt/airflow/project/data/silver
    SILVER_MANIFEST_DB: /opt/airflow/project/data/control/silver_manifest.sqlite3
    SILVER_TEMP_DIR: /opt/airflow/project/data/tmp/silver
    SILVER_CODE_VERSION: ${SILVER_CODE_VERSION:-phase6-v1}
    SILVER_SCHEMA_VERSION: ${SILVER_SCHEMA_VERSION:-silver-v1}
    SILVER_SUPPORTED_CDC_SCHEMA: ${SILVER_SUPPORTED_CDC_SCHEMA:-cdc-bronze-v1}
    SILVER_SETTLEMENT_CONTRACT: /opt/airflow/project/contracts/batch/settlement_v1.yml
    SILVER_MAX_OBJECTS: ${SILVER_MAX_OBJECTS:-100}
    PYTHONPATH: /opt/airflow/project/src
  volumes: &airflow-common-volumes
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./data/inbound:/opt/airflow/project/data/inbound
    - airflow_logs:/opt/airflow/logs
    - airflow_component_state:/opt/airflow/project/data/control
    - airflow_tmp:/opt/airflow/project/data/tmp
    - cdc_consumer_state:/opt/airflow/project/data/cdc-consumer:ro
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  portal-postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PORTAL_DB_NAME:-portal_control}
      POSTGRES_USER: ${PORTAL_DB_ADMIN_USER:-portal_admin}
      POSTGRES_PASSWORD: ${PORTAL_DB_ADMIN_PASSWORD:-change_me}
      PORTAL_DB_MIGRATION_PASSWORD: ${PORTAL_DB_MIGRATION_PASSWORD:-change_me}
      PORTAL_DB_RUNTIME_PASSWORD: ${PORTAL_DB_RUNTIME_PASSWORD:-change_me}
      PORTAL_DB_AUDIT_PASSWORD: ${PORTAL_DB_AUDIT_PASSWORD:-change_me}
      PORTAL_DB_ARCHIVE_PASSWORD: ${PORTAL_DB_ARCHIVE_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:${PORTAL_DB_PORT:-55432}:5432"
    volumes:
      - portal_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/portal/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  portal-migrate:
    image: fintech-portal-api:local
    build:
      context: .
      dockerfile: apps/portal-api/Dockerfile
      args:
        PORTAL_API_VERSION: ${PORTAL_API_SERVICE_VERSION:-0.1.0-dev}
        PORTAL_API_BUILD_SHA: ${PORTAL_API_BUILD_SHA:-local}
        PORTAL_API_BUILD_TIME: ${PORTAL_API_BUILD_TIME:-local}
    restart: "no"
    depends_on:
      portal-postgres:
        condition: service_healthy
    environment:
      PORTAL_MIGRATION_DATABASE_URL: >-
        postgresql+psycopg://portal_migration:${PORTAL_DB_MIGRATION_PASSWORD:-change_me}@portal-postgres:5432/${PORTAL_DB_NAME:-portal_control}
    command:
      - alembic
      - -c
      - /app/alembic.ini
      - upgrade
      - head

  portal-keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${PORTAL_IDP_ADMIN_USER:-portal-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PORTAL_IDP_ADMIN_PASSWORD:-local-admin-change-me}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${PORTAL_IDP_PUBLIC_URL:-http://portal-idp.localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
    ports:
      - "127.0.0.1:${PORTAL_IDP_PORT:-8081}:8081"
    networks:
      default:
        aliases:
          - portal-idp.localhost
    volumes:
      - ./infrastructure/keycloak/realm-export.json:/opt/keycloak/data/import/fintech-portal-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0

  portal-redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:${PORTAL_REDIS_PORT:-56379}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 128m
    cpus: 0.25

  portal-api:
    image: fintech-portal-api:local
    build:
      context: .
      dockerfile: apps/portal-api/Dockerfile
      args:
        PORTAL_API_VERSION: ${PORTAL_API_SERVICE_VERSION:-0.1.0-dev}
        PORTAL_API_BUILD_SHA: ${PORTAL_API_BUILD_SHA:-local}
        PORTAL_API_BUILD_TIME: ${PORTAL_API_BUILD_TIME:-local}
    restart: unless-stopped
    depends_on:
      portal-keycloak:
        condition: service_healthy
      portal-migrate:
        condition: service_completed_successfully
    environment:
      PORTAL_API_ENVIRONMENT: ${PORTAL_API_ENVIRONMENT:-local}
      PORTAL_API_SERVICE_VERSION: ${PORTAL_API_SERVICE_VERSION:-0.1.0-dev}
      PORTAL_API_API_VERSION: ${PORTAL_API_API_VERSION:-v1}
      PORTAL_API_CONTRACT_VERSION: ${PORTAL_API_CONTRACT_VERSION:-1.0.0}
      PORTAL_API_DOCUMENTATION_VERSION: ${PORTAL_API_DOCUMENTATION_VERSION:-portal-foundation-v1}
      PORTAL_API_BUILD_SHA: ${PORTAL_API_BUILD_SHA:-local}
      PORTAL_API_BUILD_TIME: ${PORTAL_API_BUILD_TIME:-local}
      PORTAL_API_LOG_LEVEL: ${PORTAL_API_LOG_LEVEL:-INFO}
      PORTAL_API_LOG_FORMAT: ${PORTAL_API_LOG_FORMAT:-console}
      PORTAL_API_HOST: 0.0.0.0
      PORTAL_API_PORT: 8010
      PORTAL_API_ALLOWED_ORIGINS: ${PORTAL_API_ALLOWED_ORIGINS:-http://localhost:3000}
      PORTAL_API_TRUSTED_HOSTS: ${PORTAL_API_TRUSTED_HOSTS:-localhost,127.0.0.1,portal-api}
      PORTAL_API_DEPENDENCY_TIMEOUT_SECONDS: ${PORTAL_API_DEPENDENCY_TIMEOUT_SECONDS:-2}
      PORTAL_API_READINESS_TIMEOUT_SECONDS: ${PORTAL_API_READINESS_TIMEOUT_SECONDS:-5}
      PORTAL_API_HEALTH_CACHE_TTL_SECONDS: ${PORTAL_API_HEALTH_CACHE_TTL_SECONDS:-2}
      PORTAL_API_TELEMETRY_ENABLED: ${PORTAL_API_TELEMETRY_ENABLED:-false}
      PORTAL_API_TELEMETRY_METRICS_EXPORTER: >-
        ${PORTAL_API_TELEMETRY_METRICS_EXPORTER:-prometheus}
      PORTAL_API_TELEMETRY_TRACE_EXPORTER: ${PORTAL_API_TELEMETRY_TRACE_EXPORTER:-none}
      PORTAL_API_TELEMETRY_TRACE_SAMPLING_RATIO: >-
        ${PORTAL_API_TELEMETRY_TRACE_SAMPLING_RATIO:-0.1}
      PORTAL_API_TELEMETRY_EXPORT_INTERVAL_SECONDS: >-
        ${PORTAL_API_TELEMETRY_EXPORT_INTERVAL_SECONDS:-30}
      PORTAL_API_TELEMETRY_EXPORT_TIMEOUT_SECONDS: >-
        ${PORTAL_API_TELEMETRY_EXPORT_TIMEOUT_SECONDS:-10}
      PORTAL_API_TELEMETRY_OTLP_ENDPOINT: >-
        ${PORTAL_API_TELEMETRY_OTLP_ENDPOINT:-http://localhost:4318}
      PORTAL_API_TELEMETRY_PROMETHEUS_HOST: 0.0.0.0
      PORTAL_API_TELEMETRY_PROMETHEUS_PORT: 9464
      PORTAL_API_TELEMETRY_RESOURCE_ATTRIBUTES: >-
        ${PORTAL_API_TELEMETRY_RESOURCE_ATTRIBUTES:-}
      PORTAL_API_OPENAPI_ENABLED: ${PORTAL_API_OPENAPI_ENABLED:-true}
      PORTAL_API_DEVELOPMENT_IDENTITY_ENABLED: "false"
      PORTAL_API_SECURITY_RUNTIME_ENABLED: ${PORTAL_API_SECURITY_RUNTIME_ENABLED:-true}
      PORTAL_API_SECRET_PROVIDER: ${PORTAL_API_SECRET_PROVIDER:-environment}
      PORTAL_API_DATABASE_URL: >-
        postgresql+psycopg://portal_runtime:${PORTAL_DB_RUNTIME_PASSWORD:-change_me}@portal-postgres:5432/${PORTAL_DB_NAME:-portal_control}
      PORTAL_API_ABUSE_PROTECTION_ENABLED: ${PORTAL_API_ABUSE_PROTECTION_ENABLED:-true}
      PORTAL_API_REDIS_URL: ${PORTAL_API_REDIS_URL:-redis://portal-redis:6379/0}
      PORTAL_API_REDIS_CONNECT_TIMEOUT_SECONDS: >-
        ${PORTAL_API_REDIS_CONNECT_TIMEOUT_SECONDS:-0.5}
      PORTAL_API_REDIS_OPERATION_TIMEOUT_SECONDS: >-
        ${PORTAL_API_REDIS_OPERATION_TIMEOUT_SECONDS:-0.25}
      PORTAL_API_REDIS_MAX_CONNECTIONS: ${PORTAL_API_REDIS_MAX_CONNECTIONS:-50}
      PORTAL_API_REDIS_KEY_PREFIX: ${PORTAL_API_REDIS_KEY_PREFIX:-portal:abuse}
      PORTAL_API_ABUSE_POLICY_VERSION: ${PORTAL_API_ABUSE_POLICY_VERSION:-development-v1}
      PORTAL_API_ABUSE_LOCAL_FALLBACK_MAX_KEYS: >-
        ${PORTAL_API_ABUSE_LOCAL_FALLBACK_MAX_KEYS:-10000}
      PORTAL_API_ABUSE_PROVIDER_MAX_CONCURRENCY: >-
        ${PORTAL_API_ABUSE_PROVIDER_MAX_CONCURRENCY:-20}
      PORTAL_API_ABUSE_PROVIDER_CONCURRENCY_LEASE_SECONDS: >-
        ${PORTAL_API_ABUSE_PROVIDER_CONCURRENCY_LEASE_SECONDS:-15}
      PORTAL_API_ABUSE_BACKEND_AUDIT_INTERVAL_SECONDS: >-
        ${PORTAL_API_ABUSE_BACKEND_AUDIT_INTERVAL_SECONDS:-60}
      PORTAL_API_FORWARDED_HEADER_MODE: ${PORTAL_API_FORWARDED_HEADER_MODE:-direct}
      PORTAL_API_TRUSTED_PROXY_CIDRS: ${PORTAL_API_TRUSTED_PROXY_CIDRS:-}
      PORTAL_API_MAX_FORWARDED_HOPS: ${PORTAL_API_MAX_FORWARDED_HOPS:-5}
      PORTAL_API_IPV4_PREFIX_LENGTH: ${PORTAL_API_IPV4_PREFIX_LENGTH:-24}
      PORTAL_API_IPV6_PREFIX_LENGTH: ${PORTAL_API_IPV6_PREFIX_LENGTH:-64}
      PORTAL_API_CLIENT_ADDRESS_HMAC_SECRET: >-
        ${PORTAL_API_CLIENT_ADDRESS_HMAC_SECRET:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      PORTAL_API_SECURITY_MASTER_KEY: >-
        ${PORTAL_API_SECURITY_MASTER_KEY:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      PORTAL_API_SECURITY_KEY_VERSION: ${PORTAL_API_SECURITY_KEY_VERSION:-local-development-v1}
      PORTAL_API_SECURITY_PREVIOUS_MASTER_KEY: ${PORTAL_API_SECURITY_PREVIOUS_MASTER_KEY:-}
      PORTAL_API_SECURITY_PREVIOUS_KEY_VERSION: ${PORTAL_API_SECURITY_PREVIOUS_KEY_VERSION:-}
      PORTAL_API_SECURITY_FUTURE_KEY_VERSION: ${PORTAL_API_SECURITY_FUTURE_KEY_VERSION:-}
      PORTAL_API_SECURITY_KEY_TRANSITION_STARTED_AT: >-
        ${PORTAL_API_SECURITY_KEY_TRANSITION_STARTED_AT:-}
      PORTAL_API_SECURITY_KEY_TRANSITION_EXPIRES_AT: >-
        ${PORTAL_API_SECURITY_KEY_TRANSITION_EXPIRES_AT:-}
      PORTAL_API_OIDC_PROVIDER_ID: ${PORTAL_API_OIDC_PROVIDER_ID:-local-keycloak}
      PORTAL_API_OIDC_ISSUER: >-
        ${PORTAL_API_OIDC_ISSUER:-http://portal-idp.localhost:8081/realms/fintech-portal}
      PORTAL_API_OIDC_DISCOVERY_URL: >-
        ${PORTAL_API_OIDC_DISCOVERY_URL:-http://portal-idp.localhost:8081/realms/fintech-portal/.well-known/openid-configuration}
      PORTAL_API_OIDC_CLIENT_ID: ${PORTAL_API_OIDC_CLIENT_ID:-fintech-portal}
      PORTAL_API_OIDC_CLIENT_SECRET: ${PORTAL_API_OIDC_CLIENT_SECRET:-local-portal-client-secret}
      PORTAL_API_OIDC_REDIRECT_URI: ${PORTAL_API_OIDC_REDIRECT_URI:-http://localhost:3000/portal-api/v1/auth/callback}
      PORTAL_API_OIDC_SCOPES: ${PORTAL_API_OIDC_SCOPES:-openid profile}
      PORTAL_API_OIDC_ALLOWED_ALGORITHMS: ${PORTAL_API_OIDC_ALLOWED_ALGORITHMS:-RS256}
      PORTAL_API_OIDC_GROUP_CLAIM_PATH: ${PORTAL_API_OIDC_GROUP_CLAIM_PATH:-groups}
      PORTAL_API_OIDC_ALLOWED_ROLES: >-
        ${PORTAL_API_OIDC_ALLOWED_ROLES:-portal_viewer,data_engineer_viewer,platform_operator_viewer,security_auditor_viewer,portal_admin_viewer}
      PORTAL_API_ALLOWED_RETURN_PATHS: ${PORTAL_API_ALLOWED_RETURN_PATHS:-/,/system-status}
      PORTAL_API_ALLOWED_ENVIRONMENT_IDS: ${PORTAL_API_ALLOWED_ENVIRONMENT_IDS:-local,development}
      PORTAL_API_PORTAL_TENANT_ID: ${PORTAL_API_PORTAL_TENANT_ID:-fintech-platform-primary}
      PORTAL_API_IDENTITY_MAPPING_REVISION: ${PORTAL_API_IDENTITY_MAPPING_REVISION:-local-mapping-v1}
      PORTAL_API_CALLBACK_POLICY_REVISION: ${PORTAL_API_CALLBACK_POLICY_REVISION:-local-callback-policy-v1}
      PORTAL_API_CAPABILITY_REVISION: ${PORTAL_API_CAPABILITY_REVISION:-local-capability-v1}
      PORTAL_API_SESSION_SECURITY_EPOCH: ${PORTAL_API_SESSION_SECURITY_EPOCH:-1}
      PORTAL_API_SESSION_IDLE_TTL_SECONDS: ${PORTAL_API_SESSION_IDLE_TTL_SECONDS:-1800}
      PORTAL_API_SESSION_ABSOLUTE_TTL_SECONDS: ${PORTAL_API_SESSION_ABSOLUTE_TTL_SECONDS:-28800}
      PORTAL_API_IDENTITY_FRESHNESS_SECONDS: ${PORTAL_API_IDENTITY_FRESHNESS_SECONDS:-900}
      PORTAL_API_SESSION_ACTIVITY_WRITE_INTERVAL_SECONDS: ${PORTAL_API_SESSION_ACTIVITY_WRITE_INTERVAL_SECONDS:-60}
      PORTAL_API_MAXIMUM_ACTIVE_SESSIONS: ${PORTAL_API_MAXIMUM_ACTIVE_SESSIONS:-5}
      PORTAL_API_OIDC_HTTP_TIMEOUT_SECONDS: ${PORTAL_API_OIDC_HTTP_TIMEOUT_SECONDS:-5}
      PORTAL_API_PROVIDER_REFRESH_ENABLED: ${PORTAL_API_PROVIDER_REFRESH_ENABLED:-true}
      PORTAL_API_PROVIDER_REFRESH_THRESHOLD_SECONDS: >-
        ${PORTAL_API_PROVIDER_REFRESH_THRESHOLD_SECONDS:-120}
      PORTAL_API_PROVIDER_REFRESH_SCAN_INTERVAL_SECONDS: >-
        ${PORTAL_API_PROVIDER_REFRESH_SCAN_INTERVAL_SECONDS:-5}
      PORTAL_API_PROVIDER_REFRESH_RETRY_BUDGET: >-
        ${PORTAL_API_PROVIDER_REFRESH_RETRY_BUDGET:-3}
      PORTAL_API_PROVIDER_REFRESH_INITIAL_BACKOFF_SECONDS: >-
        ${PORTAL_API_PROVIDER_REFRESH_INITIAL_BACKOFF_SECONDS:-1}
      PORTAL_API_PROVIDER_REFRESH_MAX_BACKOFF_SECONDS: >-
        ${PORTAL_API_PROVIDER_REFRESH_MAX_BACKOFF_SECONDS:-30}
      PORTAL_API_PROVIDER_REFRESH_LEASE_SECONDS: >-
        ${PORTAL_API_PROVIDER_REFRESH_LEASE_SECONDS:-30}
      PORTAL_API_PROVIDER_REFRESH_BATCH_SIZE: >-
        ${PORTAL_API_PROVIDER_REFRESH_BATCH_SIZE:-25}
      PORTAL_API_PROVIDER_LOGOUT_TIMEOUT_SECONDS: >-
        ${PORTAL_API_PROVIDER_LOGOUT_TIMEOUT_SECONDS:-5}
      PORTAL_API_PROVIDER_LOGOUT_REPLAY_TTL_SECONDS: >-
        ${PORTAL_API_PROVIDER_LOGOUT_REPLAY_TTL_SECONDS:-86400}
      PORTAL_API_LOGIN_INTENT_TTL_SECONDS: ${PORTAL_API_LOGIN_INTENT_TTL_SECONDS:-300}
      PORTAL_API_LOGIN_TRANSACTION_TTL_SECONDS: ${PORTAL_API_LOGIN_TRANSACTION_TTL_SECONDS:-300}
    ports:
      - "127.0.0.1:${PORTAL_API_PORT:-8010}:8010"
      - "127.0.0.1:${PORTAL_API_PROMETHEUS_PORT:-9464}:9464"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.50

  portal-audit-worker:
    image: fintech-portal-api:local
    restart: unless-stopped
    depends_on:
      portal-migrate:
        condition: service_completed_successfully
    environment:
      PORTAL_API_ENVIRONMENT: ${PORTAL_API_ENVIRONMENT:-local}
      PORTAL_API_SERVICE_NAME: portal-audit-worker
      PORTAL_API_SERVICE_VERSION: ${PORTAL_API_SERVICE_VERSION:-0.1.0-dev}
      PORTAL_API_BUILD_SHA: ${PORTAL_API_BUILD_SHA:-local}
      PORTAL_API_BUILD_TIME: ${PORTAL_API_BUILD_TIME:-local}
      PORTAL_API_LOG_LEVEL: ${PORTAL_API_LOG_LEVEL:-INFO}
      PORTAL_API_LOG_FORMAT: ${PORTAL_API_LOG_FORMAT:-console}
      PORTAL_API_SECURITY_RUNTIME_ENABLED: "false"
      PORTAL_API_SECRET_PROVIDER: ${PORTAL_API_SECRET_PROVIDER:-environment}
      PORTAL_API_ABUSE_PROTECTION_ENABLED: "false"
      PORTAL_API_AUDIT_OUTBOX_ENABLED: ${PORTAL_API_AUDIT_OUTBOX_ENABLED:-true}
      PORTAL_API_AUDIT_WORKER_DATABASE_URL: >-
        postgresql+psycopg://portal_archive:${PORTAL_DB_ARCHIVE_PASSWORD:-change_me}@portal-postgres:5432/${PORTAL_DB_NAME:-portal_control}
      PORTAL_API_AUDIT_OUTBOX_POLL_INTERVAL_SECONDS: >-
        ${PORTAL_API_AUDIT_OUTBOX_POLL_INTERVAL_SECONDS:-1}
      PORTAL_API_AUDIT_OUTBOX_BATCH_SIZE: ${PORTAL_API_AUDIT_OUTBOX_BATCH_SIZE:-100}
      PORTAL_API_AUDIT_OUTBOX_WORKER_CONCURRENCY: >-
        ${PORTAL_API_AUDIT_OUTBOX_WORKER_CONCURRENCY:-4}
      PORTAL_API_AUDIT_OUTBOX_LEASE_SECONDS: >-
        ${PORTAL_API_AUDIT_OUTBOX_LEASE_SECONDS:-30}
      PORTAL_API_AUDIT_OUTBOX_MAX_ATTEMPTS: >-
        ${PORTAL_API_AUDIT_OUTBOX_MAX_ATTEMPTS:-5}
      PORTAL_API_AUDIT_OUTBOX_BASE_BACKOFF_SECONDS: >-
        ${PORTAL_API_AUDIT_OUTBOX_BASE_BACKOFF_SECONDS:-1}
      PORTAL_API_AUDIT_OUTBOX_MAX_BACKOFF_SECONDS: >-
        ${PORTAL_API_AUDIT_OUTBOX_MAX_BACKOFF_SECONDS:-60}
      PORTAL_API_AUDIT_OUTBOX_DESTINATION: >-
        ${PORTAL_API_AUDIT_OUTBOX_DESTINATION:-local_postgres}
      PORTAL_API_AUDIT_OUTBOX_DELIVERY_TIMEOUT_SECONDS: >-
        ${PORTAL_API_AUDIT_OUTBOX_DELIVERY_TIMEOUT_SECONDS:-5}
      PORTAL_API_AUDIT_OUTBOX_RETENTION_DAYS: >-
        ${PORTAL_API_AUDIT_OUTBOX_RETENTION_DAYS:-7}
      PORTAL_API_AUDIT_DEAD_LETTER_RETENTION_DAYS: >-
        ${PORTAL_API_AUDIT_DEAD_LETTER_RETENTION_DAYS:-30}
      PORTAL_API_MAINTENANCE_ENABLED: ${PORTAL_API_MAINTENANCE_ENABLED:-true}
      PORTAL_API_MAINTENANCE_INTERVAL_SECONDS: >-
        ${PORTAL_API_MAINTENANCE_INTERVAL_SECONDS:-60}
      PORTAL_API_MAINTENANCE_BATCH_SIZE: ${PORTAL_API_MAINTENANCE_BATCH_SIZE:-100}
      PORTAL_API_MAINTENANCE_MAX_RUNTIME_SECONDS: >-
        ${PORTAL_API_MAINTENANCE_MAX_RUNTIME_SECONDS:-30}
      PORTAL_API_REPLAY_RETENTION_BUFFER_SECONDS: >-
        ${PORTAL_API_REPLAY_RETENTION_BUFFER_SECONDS:-300}
      PORTAL_API_TERMINAL_ENVELOPE_RETENTION_DAYS: >-
        ${PORTAL_API_TERMINAL_ENVELOPE_RETENTION_DAYS:-7}
      PORTAL_API_TELEMETRY_ENABLED: ${PORTAL_API_TELEMETRY_ENABLED:-false}
      PORTAL_API_TELEMETRY_METRICS_EXPORTER: ${PORTAL_API_TELEMETRY_METRICS_EXPORTER:-none}
      PORTAL_API_TELEMETRY_TRACE_EXPORTER: ${PORTAL_API_TELEMETRY_TRACE_EXPORTER:-none}
    command:
      - python
      - -m
      - portal_api.audit.worker
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - portal_api.audit.worker
        - --healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.50

  portal-web:
    build:
      context: .
      dockerfile: apps/portal-web/Dockerfile
      args:
        PORTAL_WEB_VERSION: ${NEXT_PUBLIC_PORTAL_WEB_VERSION:-0.1.0-dev}
        PORTAL_BUILD_SHA: ${NEXT_PUBLIC_PORTAL_BUILD_SHA:-local}
        PORTAL_ENV: ${NEXT_PUBLIC_PORTAL_ENV:-local}
        PORTAL_API_INTERNAL_URL: http://portal-api:8010
        PORTAL_IDP_PUBLIC_URL: ${PORTAL_IDP_PUBLIC_URL:-http://portal-idp.localhost:8081}
    restart: unless-stopped
    depends_on:
      portal-api:
        condition: service_healthy
    environment:
      PORTAL_API_INTERNAL_URL: http://portal-api:8010
      PORTAL_PUBLIC_ORIGIN: ${PORTAL_PUBLIC_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${PORTAL_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 384m
    cpus: 0.75

  postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=${POSTGRES_MAX_REPLICATION_SLOTS:-10}
      - -c
      - max_wal_senders=${POSTGRES_MAX_WAL_SENDERS:-10}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_REGION_NAME: ${MINIO_REGION:-us-east-1}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-fintech-bronze}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-fintech-quarantine}
      MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-fintech-silver}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing --region "$${MINIO_REGION}" "local/$${MINIO_BRONZE_BUCKET}" &&
        mc mb --ignore-existing --region "$${MINIO_REGION}" "local/$${MINIO_QUARANTINE_BUCKET}" &&
        mc mb --ignore-existing --region "$${MINIO_REGION}" "local/$${MINIO_SILVER_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_BRONZE_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_QUARANTINE_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_SILVER_BUCKET}"

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
      KAFKA_LOG_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-connect:
    image: quay.io/debezium/connect:3.6.0.Final
    hostname: kafka-connect
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: fintech-payments-connect
      CONFIG_STORAGE_TOPIC: fintech.connect.configs
      OFFSET_STORAGE_TOPIC: fintech.connect.offsets
      STATUS_STORAGE_TOPIC: fintech.connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      REST_ADVERTISED_HOST_NAME: kafka-connect
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8083/connector-plugins >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  connector-init:
    build:
      context: ./infrastructure/debezium
      dockerfile: connector-init.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-fintech.cdc}
      KAFKA_DEFAULT_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-3}
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:-604800000}
      DEBEZIUM_CONNECTOR_NAME: ${DEBEZIUM_CONNECTOR_NAME:-payments-postgres-cdc}
      DEBEZIUM_SLOT_NAME: ${DEBEZIUM_SLOT_NAME:-fintech_payments_cdc_slot}
      DEBEZIUM_PUBLICATION_NAME: ${DEBEZIUM_PUBLICATION_NAME:-fintech_payments_cdc_publication}
      DEBEZIUM_DATABASE_HOST: postgres
      DEBEZIUM_DATABASE_PORT: 5432
      DEBEZIUM_DATABASE_NAME: ${DEBEZIUM_DATABASE_NAME:-fintech_payments}
      DEBEZIUM_DATABASE_USER: ${DEBEZIUM_DATABASE_USER:-payments_cdc}
      DEBEZIUM_DATABASE_PASSWORD: ${DEBEZIUM_DATABASE_PASSWORD:?DEBEZIUM_DATABASE_PASSWORD must be set}
      DEBEZIUM_HEARTBEAT_INTERVAL_MS: ${DEBEZIUM_HEARTBEAT_INTERVAL_MS:-10000}
      DEBEZIUM_SNAPSHOT_MODE: ${DEBEZIUM_SNAPSHOT_MODE:-initial}
      CDC_HTTP_TIMEOUT_SECONDS: ${CDC_HTTP_TIMEOUT_SECONDS:-10}
      CDC_HTTP_MAX_ATTEMPTS: ${CDC_HTTP_MAX_ATTEMPTS:-10}
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./infrastructure/debezium/connectors:/app/connectors:ro
    command:
      - /bin/sh
      - -c
      - >-
        python scripts/cdc/bootstrap_postgres.py &&
        python scripts/cdc/register_connector.py
        --template /app/connectors/payments-postgres.json --wait-running

  cdc-consumer:
    profiles:
      - cdc-consumer
    build:
      context: .
      dockerfile: infrastructure/cdc-consumer/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      connector-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-fintech-bronze}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET:-fintech-quarantine}
      MINIO_CONNECT_TIMEOUT_SECONDS: ${MINIO_CONNECT_TIMEOUT_SECONDS:-5}
      MINIO_READ_TIMEOUT_SECONDS: ${MINIO_READ_TIMEOUT_SECONDS:-30}
      MINIO_MAX_RETRIES: ${MINIO_MAX_RETRIES:-3}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-fintech.cdc}
      CDC_CONSUMER_GROUP_ID: ${CDC_CONSUMER_GROUP_ID:-fintech-cdc-bronze-v1}
      CDC_CONSUMER_CLIENT_ID: ${CDC_CONSUMER_CLIENT_ID:-fintech-cdc-bronze-consumer}
      CDC_CONSUMER_TOPICS: ${CDC_CONSUMER_TOPICS:?CDC_CONSUMER_TOPICS must be set}
      CDC_CONSUMER_AUTO_OFFSET_RESET: ${CDC_CONSUMER_AUTO_OFFSET_RESET:-earliest}
      CDC_CONSUMER_BATCH_SIZE: ${CDC_CONSUMER_BATCH_SIZE:-100}
      CDC_CONSUMER_FLUSH_INTERVAL_SECONDS: ${CDC_CONSUMER_FLUSH_INTERVAL_SECONDS:-5}
      CDC_CONSUMER_POLL_TIMEOUT_MS: ${CDC_CONSUMER_POLL_TIMEOUT_MS:-1000}
      CDC_CONSUMER_MAX_POLL_INTERVAL_MS: ${CDC_CONSUMER_MAX_POLL_INTERVAL_MS:-300000}
      CDC_CONSUMER_SESSION_TIMEOUT_MS: ${CDC_CONSUMER_SESSION_TIMEOUT_MS:-45000}
      CDC_CONSUMER_HEARTBEAT_INTERVAL_MS: ${CDC_CONSUMER_HEARTBEAT_INTERVAL_MS:-15000}
      CDC_CONSUMER_MAX_RETRIES: ${CDC_CONSUMER_MAX_RETRIES:-3}
      CDC_CONSUMER_RETRY_BACKOFF_SECONDS: ${CDC_CONSUMER_RETRY_BACKOFF_SECONDS:-0.5}
      CDC_DLQ_TOPIC: ${CDC_DLQ_TOPIC:-fintech.cdc.dlq}
      CDC_BRONZE_BUCKET: ${CDC_BRONZE_BUCKET:-fintech-bronze}
      CDC_QUARANTINE_BUCKET: ${CDC_QUARANTINE_BUCKET:-fintech-quarantine}
      CDC_SCHEMA_VERSION: ${CDC_SCHEMA_VERSION:-cdc-bronze-v1}
      CDC_CONSUMER_MANIFEST_DB: /app/data/control/cdc_consumer_manifest.sqlite3
      CDC_CONSUMER_TEMP_DIR: /app/data/tmp/cdc_consumer
      CDC_CONSUMER_SHUTDOWN_TIMEOUT_SECONDS: ${CDC_CONSUMER_SHUTDOWN_TIMEOUT_SECONDS:-30}
    volumes:
      - cdc_consumer_state:/app/data/control
      - cdc_consumer_tmp:/app/data/tmp

  airflow-postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_DATABASE_NAME:?AIRFLOW_DATABASE_NAME must be set}
      POSTGRES_USER: ${AIRFLOW_DATABASE_USER:?AIRFLOW_DATABASE_USER must be set}
      POSTGRES_PASSWORD: ${AIRFLOW_DATABASE_PASSWORD:?AIRFLOW_DATABASE_PASSWORD must be set}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint:
      - /bin/bash
      - -c
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-environment
      AIRFLOW_DATABASE_HOST: airflow-postgres
      AIRFLOW_DATABASE_PORT: 5432
      AIRFLOW_DATABASE_NAME: ${AIRFLOW_DATABASE_NAME:?AIRFLOW_DATABASE_NAME must be set}
      AIRFLOW_DATABASE_USER: ${AIRFLOW_DATABASE_USER:?AIRFLOW_DATABASE_USER must be set}
      AIRFLOW_DATABASE_PASSWORD: ${AIRFLOW_DATABASE_PASSWORD:?AIRFLOW_DATABASE_PASSWORD must be set}
      CONTROL_DATABASE_USER: ${CONTROL_DATABASE_USER:?CONTROL_DATABASE_USER must be set}
      CONTROL_DATABASE_PASSWORD: ${CONTROL_DATABASE_PASSWORD:?CONTROL_DATABASE_PASSWORD must be set}
      AIRFLOW_UID_VALUE: ${AIRFLOW_UID:-50000}
    command:
      - |
        chown -R "$${AIRFLOW_UID_VALUE}:0" \
          /opt/airflow/logs \
          /opt/airflow/project/data/control \
          /opt/airflow/project/data/tmp
        chmod -R g+rwX \
          /opt/airflow/logs \
          /opt/airflow/project/data/control \
          /opt/airflow/project/data/tmp
        export HOME=/home/airflow
        exec setpriv \
          --reuid="$${AIRFLOW_UID_VALUE}" \
          --regid=0 \
          --clear-groups \
          bash -c 'airflow db migrate && python /opt/airflow/project/scripts/airflow/bootstrap_control.py'

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    command:
      - api-server
    ports:
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://localhost:8080/api/v2/monitor/health >/dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    command:
      - scheduler
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-postgres:
        condition: service_healthy
    command:
      - dag-processor
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  portal_postgres_data:
    name: fintech-payments-portal-postgres-data
  postgres_data:
    name: fintech-payments-postgres-data
  minio_data:
    name: fintech-payments-minio-data
  kafka_data:
    name: fintech-payments-kafka-data
  cdc_consumer_state:
    name: fintech-payments-cdc-consumer-state
  cdc_consumer_tmp:
    name: fintech-payments-cdc-consumer-tmp
  airflow_postgres_data:
    name: fintech-payments-airflow-postgres-data
  airflow_logs:
    name: fintech-payments-airflow-logs
  airflow_component_state:
    name: fintech-payments-airflow-component-state
  airflow_tmp:
    name: fintech-payments-airflow-tmp
