name: Scheduled Security

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portal-full-security:
    name: Portal full source, history, and image security
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Run full tracked-source security gates
        run: python3 scripts/security/scan.py full

      - name: Run complete Git-history secret scan
        run: python3 scripts/security/scan.py history

      - name: Build exact Portal images for refreshed advisory review
        run: >-
          python3 scripts/portal/build_reproducible_artifacts.py
          --output build/portal-artifacts/manifest.json
          --require-clean

      - name: Review exact Portal and vendor images with refreshed databases
        run: python3 scripts/security/scan.py images

      - name: Upload sanitized scheduled reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: portal-scheduled-security-reports
          path: |
            build/security/full.json
            build/security/history.json
            build/security/images.json
          if-no-files-found: error
          retention-days: 30
